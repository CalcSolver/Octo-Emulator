<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Octo Arcade - WebAssembly Game Launcher</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #121824;
      --accent: #22c55e;
      --pink: #ff2a85;
      --text: #f3f4f6;
    }
    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: 100%;
      padding: 1rem 2rem;
      background: #0f172a;
      display: flex;
      align-items: center;
      gap: 12px;
      box-sizing: border-box;
      border-bottom: 1px solid #1e293b;
    }
    .logo {
      font-weight: 800;
      color: var(--accent);
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .drop-zone {
      margin-top: 4rem;
      width: 90%;
      max-width: 650px;
      padding: 3rem 2rem;
      background: var(--card-bg);
      border: 2px dashed #334155;
      border-radius: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .drop-zone:hover {
      border-color: var(--accent);
      background: #1e293b;
    }
    .btn-choose {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 12px 28px;
      border-radius: 24px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1rem;
    }
    #status {
      margin-top: 1.5rem;
      color: #94a3b8;
      font-family: monospace;
    }
    #canvas-container {
      display: none;
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      background: #000;
      z-index: 999;
    }
    canvas {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--pink)"><path d="M12 2a10 10 0 0 0-10 10c0 5.52 4.48 10 10 10s10-4.48 10-10A10 10 0 0 0 12 2zm-3 8a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm6 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
      Octo Arcade
    </div>
  </header>

  <div class="drop-zone" id="dropZone">
    <h2>Bring Your Own Disc (.xiso)</h2>
    <p>Upload your legally owned disc image. The parser extracts game maps locally inside your browser—no files are uploaded.</p>
    <input type="file" id="fileInput" accept=".xiso,.iso" style="display: none;">
    <button class="btn-choose" onclick="document.getElementById('fileInput').click()">Choose XISO File</button>
    <div id="status">Waiting for file...</div>
  </div>

  <div id="canvas-container">
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
  </div>

  <script src="xiso-parser.js"></script>
  <script>
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const canvasContainer = document.getElementById('canvas-container');

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      try {
        const extractor = new XISOExtractor(file);
        await extractor.parseAndExtractMaps((msg) => {
          status.innerText = msg;
        });

        // Launch WebAssembly Game Engine once assets are mounted
        status.innerText = "Starting engine...";
        setTimeout(launchEngine, 1000);

      } catch (err) {
        status.innerText = "Error: " + err.message;
        status.style.color = "#ef4444";
      }
    });

    function launchEngine() {
      canvasContainer.style.display = "block";
      
      // Load WebAssembly C++ engine (e.g., game.js generated from Emscripten)
      const script = document.createElement('script');
      script.src = "game-engine.js"; 
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
